[platformio]
default_envs = cyd2usb

[env]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  h2zero/NimBLE-Arduino@^1.4.3
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=0

; Classic single-USB CYD (ILI9341), GPIO21 backlight
[env:cyd]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1
  -DCYD_BL_PIN=21

; Dual-USB / USB-C CYD clones (ST7789), GPIO27 backlight
[env:cyd2usb]
build_flags =
  ${env.build_flags}
  -DST7789_2_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DCYD_BL_PIN=27
